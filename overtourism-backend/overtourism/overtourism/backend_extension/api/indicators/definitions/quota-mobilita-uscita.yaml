# quota-mobilita-uscita
# OD flows: share of the users present in an area who go on to another area.
#
# See ../README.md for the format of this file.

name: Quota di mobilità in uscita
category: Flussi
order: 51
index_value_unit_description: Quota delle giornate-utente presenti associate a flussi in uscita
year_only: true
macro_area_min_value_coverage: 0.5
description: >-
  L'indice misura la <strong>quota degli utenti presenti in un'area che proseguono verso un'altra area</strong> 
  (rapporto fra gli utenti diretti verso altre aree e il totale degli utenti presenti). Valori alti 
  indicano località da cui i visitatori ripartono per visitare altre destinazioni. Il valore 
  può superare 1, poiché un singolo utente può essere conteggiato in più aree. Per le aggregazioni 
  (macroaree e provincia), il dato è mostrato solo se almeno la metà dei comuni presenta un valore 
  valido. <br>{{flow_common}}

phenomena:
  - {name: quota_uscita_combined, type: FlowIndicatorPhenomenon, source: flows_od, col: quota_uscita_combined}
  - {name: quota_uscita_tourist, type: FlowIndicatorPhenomenon, source: flows_od, col: quota_uscita_tourist}
  - {name: quota_uscita_visitor, type: FlowIndicatorPhenomenon, source: flows_od, col: quota_uscita_visitor}

formula: quota_uscita_combined

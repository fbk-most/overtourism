# distanza-media-turisti
# Arrival-weighted mean travel time of the tourists, in hours. Python combinator.
#
# See ../README.md for the format of this file.

name: Distanza media turisti
category: Provenienza
order: 104
index_value_unit_description: Ore (media pesata sugli arrivi)
description: >-
  L'indice stima il <strong>tempo medio impiegato dai turisti per raggiungere la località</strong>.
  Per ogni area, i tempi di percorrenza verso essa sono combinati con una <strong>media pesata
  sugli arrivi</strong> dell'intero periodo selezionato, così le provenienze con più arrivi contano
  di più. Il valore è espresso in <strong>ore</strong> (es. 4,5 = 4 ore e 30 minuti). Sono
  considerati solo i turisti, e solo le provenienze con arrivi e tempo di percorrenza noti.
  <br><strong>Fonti dei dati</strong>: arrivi giornalieri di turisti per paese di
  provenienza rilevati da Vodafone con i dati della rete di telefonia mobile (attribuiti ai comuni
  in proporzione ai posti letto ISPAT per le aree con più comuni); matrice dei tempi di percorrenza
  verso i comuni trentini, calcolata con OpenStreetMap/OSRM (percorso in auto più veloce, senza
  traffico, verso il capoluogo di ciascun comune). <br>È una <strong>stima</strong>: ogni arrivo
  italiano è rappresentato da un'unica città di riferimento, ogni arrivo estero dalla capitale del
  paese (in auto se a meno di 1000 km da Trento, altrimenti in aereo fino a Bergamo e poi in auto,
  senza attese aeroportuali).

phenomena:
  - {name: tourist_arrivals, type: TravelTimeArrivalsPhenomenon, source: travel_time, measure: arrivals}
  - {name: arrival_minutes, type: TravelTimeArrivalsPhenomenon, source: travel_time, measure: arrival_minutes, hidden: true}

combinator: average_travel_time
params: {minutes_column: arrival_minutes, arrivals_column: tourist_arrivals}

# gini-stagionalita
# Normalized Gini of the daily tourist presences (+ seasonality cluster columns). Python class.
#
# See ../README.md for the format of this file.

name: Indice di stagionalità delle presenze
category: Pressione turistica
order: 16
index_value_unit_description: Indice di Gini normalizzato (0 = uniforme, 1 = concentrato)
year_only: true
available_for_variation: false
description: >-
  L'indice di Gini quantifica la <strong>concentrazione temporale delle presenze turistiche
  giornaliere</strong> nel periodo selezionato. Il valore 0 indica una distribuzione uniforme, il
  valore 1 la concentrazione in un unico giorno.

  <br><strong>Fonte dei dati</strong>: presenze giornaliere di turisti (persone che pernottano)
  rilevate da Vodafone tramite la rete mobile. Per le aree Vodafone che comprendono più comuni, le
  presenze sono attribuite ai comuni in proporzione ai posti letto ISPAT. <br>L'indice comunale è normalizzato tra 0 e 1 e non è
  disponibile se i giorni con dato coprono meno dell'80% del periodo, se sono meno di due, o se le
  presenze totali sono nulle. Per macroaree e provincia si usa la media degli indici comunali.<br>

  Per ogni comune è indicato anche il <strong>cluster stagionale</strong> (codice e tipologia):
  indica in quali mesi dell'anno si concentra il turismo:
  <br>- <strong>annuale</strong>: presenze distribuite in modo abbastanza uniforme su tutti i mesi,
  senza un picco netto;
  <br>- <strong>sci</strong>: turismo concentrato nei mesi invernali (dicembre, gennaio, febbraio);
  <br>- <strong>estate_spalle</strong>: turismo estivo che si estende anche alle "spalle", cioè i
  mesi di mezza stagione a cavallo tra bassa e alta stagione (primavera e autunno);
  <br>- <strong>estate_breve</strong>: turismo concentrato quasi solo in estate (soprattutto luglio
  e agosto), con pochissimo inverno.
  <br>Il cluster è calcolato una sola volta sul profilo mensile delle presenze turistiche Vodafone
  dell'intero periodo disponibile, quindi non dipende dal periodo selezionato. I quattro gruppi sono
  individuati automaticamente (KMeans) e poi denominati in base alla forma media del profilo mensile.

class: TouristPresenceGiniIndicator
sources:
  source_file: presences
  clusters_file: seasonality_clusters
# Reusable pieces of description text. Use one in a description as {{name}}.
# (Only descriptions are expanded; unknown names stop the start-up.)

flow_common: >-
  <strong>Fonte dei dati</strong>: flussi origine-destinazione di utenti della rete di telefonia mobile tra due aree nello stesso periodo, forniti dalla rete Vodafone. I conteggi inferiori alla soglia di privacy (circa 15 utenti) sono azzerati.
  Quando i profili sono aggregati, si applicano pesi scelti: 1 per una giornata-utente turistica e
  0,5 per una di escursionista. Se un'area comprende più comuni, il suo valore è attribuito a
  ciascuno.

ispat_structures_source: >-
  <strong>Fonte dei dati</strong>: ISPAT, statistiche sulla consistenza delle strutture ricettive
  (annuario del turismo).
